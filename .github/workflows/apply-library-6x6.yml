name: Apply library 6x6 layout

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_library_grid_8x8.py'
      - '.github/workflows/apply-library-6x6.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 6x6 library layout
        run: python tools/fix_library_grid_8x8.py
      - name: Validate page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          if 'grid-template-columns:repeat(6,minmax(0,1fr))' not in s:
              raise SystemExit('6-column grid missing')
          if 'pageSize:36' not in s:
              raise SystemExit('fixed 36-item pagination missing')
          if 'id="libPageSize"' in s or 'els.libPageSize' in s:
              raise SystemExit('page-size selector residue')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit page update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: use 6x6 library card layout'
          git push
