name: Patch Admin Content Center V1

on:
  push:
    branches:
      - feat/admin-content-center-v1

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-content-center-v1
          fetch-depth: 0
      - name: Patch front-end entry
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="content-center.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no </body> marker')
              s = s.replace('</body>', tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          node --check content-center.js
          grep -q '<title>影视收藏夹管理后台 V1</title>' admin.html
          test "$(grep -o '<script src="content-center.js"></script>' index.html | wc -l)" -eq 1
          grep -q 'MovieCollectionContentCenter' content-center.js
      - name: Commit and self-clean
        shell: bash
        run: |
          rm -f .github/workflows/patch-index-admin-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html .github/workflows/patch-index-admin-v1.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: wire admin content center into app'
          git push origin HEAD:feat/admin-content-center-v1
