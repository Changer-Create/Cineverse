name: Fix settings layout and remove brand customization

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_settings_layout_remove_brand.py'
      - '.github/workflows/fix-settings-layout.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/fix_settings_layout_remove_brand.py'
      - 'tools/settings-layout-trigger.txt'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Apply settings cleanup
        run: python tools/fix_settings_layout_remove_brand.py
      - name: Validate index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([A-Za-z][A-Za-z0-9_-]*)"',s)
          if len(ids)!=len(set(ids)):
              raise SystemExit('duplicate static DOM id detected')
          if '收藏夹品牌 · 左侧导航' in s:
              raise SystemExit('brand card still present')
          if 'grid-template-columns:minmax(0,1fr) minmax(0,1fr)' not in s:
              raise SystemExit('two-column settings layout missing')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          print('static ids:',len(ids))
          PY
          node --check /tmp/app.js
      - name: Commit cleaned settings page
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: simplify settings layout and remove brand customization'
          git push
