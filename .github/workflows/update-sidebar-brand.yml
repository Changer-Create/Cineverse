name: Update sidebar brand

on:
  push:
    branches: [main]
    paths:
      - 'tools/update_sidebar_brand_text.py'
      - '.github/workflows/update-sidebar-brand.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/sidebar-brand-trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Update sidebar brand
        run: python tools/update_sidebar_brand_text.py
      - name: Validate page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          if 'id="sidebarBrandMark"' in s or '<span class="v2">V2</span>' in s:
              raise SystemExit('brand icon or V2 badge still present')
          if 'id="sidebarBrandTitle">光影宇宙</h1>' not in s:
              raise SystemExit('brand title missing')
          if 'id="sidebarBrandSubtitle">定制化影视收藏夹</small>' not in s:
              raise SystemExit('brand subtitle missing')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: simplify sidebar brand'
          git push
