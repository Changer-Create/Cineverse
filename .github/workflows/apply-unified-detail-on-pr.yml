name: Finish unified detail continuity

on:
  pull_request:
    branches:
      - integrate/codex-c43829

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.head_ref == 'fix/unify-detail-renderer-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Preserve TMDb public score across in-place collection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path=Path('index.html')
          index=index_path.read_text()
          old="radar:{discovered:false,ignored:false}})}"
          new="radar:{discovered:false,ignored:false,publicReputation:data.publicScore!=null?Number(data.publicScore):null}})}"
          if old in index:
              index=index.replace(old,new,1)
          elif new not in index:
              raise SystemExit('tmdbMovieFromData radar anchor missing')
          index_path.write_text(index)

          test_path=Path('test/unified-detail-state.test.js')
          test=test_path.read_text()
          anchor="  assert.equal(movie.info.overview,'完整简介');\n"
          addition="  assert.equal(movie.radar.publicReputation,8.7);\n"
          if addition not in test:
              if anchor not in test:
                  raise SystemExit('unified detail test anchor missing')
              test=test.replace(anchor,anchor+addition,1)
          test=test.replace("countries:['中国'],genres:['剧情'],overview:'完整简介',posterUrl:'https://image.tmdb.org/t/p/w500/example.jpg',", "countries:['中国'],genres:['剧情'],overview:'完整简介',posterUrl:'https://image.tmdb.org/t/p/w500/example.jpg',publicScore:8.7,")
          test_path.write_text(test)
          PY

          rm -f unify-detail-continuity.trigger

      - name: Run repository checks
        run: npm run check

      - name: Validate diff whitespace
        run: git diff --check

      - name: Commit continuity fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve TMDb score when detail becomes collected'
          git push origin HEAD:fix/unify-detail-renderer-v2
