name: Fix Admin V1.1 Runtime

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/admin-v1-1-operations-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-v1-1-operations-final
          fetch-depth: 0
      - name: Fix runtime issues
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin-data.js')
          s=p.read_text(encoding='utf-8')
          old="const next={month,status:$('#peStatus').value,plannedDate:$('#peDate').value||null};"
          new="const next={month,status:$('#peStatus').value,plannedDate:$('#peDate').value||null};"
          # Avoid Python interpreting JS object shorthand: replace the exact buggy token instead.
          if "const next={month,status:$('#peStatus').value" not in s:
              raise SystemExit('plan status marker missing')
          s=s.replace("const next={month,status:$('#peStatus').value", "const next={month:month,status:$('#peStatus').value", 1)
          s=s.replace("countries:(d.production_countries||d.origin_country||[]).map", "countries:((d.production_countries||[]).length?d.production_countries:(d.origin_country||[])).map", 1)
          p.write_text(s,encoding='utf-8')
      - name: Validate and self-clean
        shell: bash
        run: |
          node --check admin-data.js
          grep -q "const next={month:month,status:" admin-data.js
          rm -f .github/workflows/fix-admin-v1-1-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden admin v1.1 runtime actions'
          git push origin HEAD:feat/admin-v1-1-operations-final
