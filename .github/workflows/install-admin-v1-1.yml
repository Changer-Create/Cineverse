name: Install Admin V1.1

on:
  push:
    branches:
      - feat/admin-v1-1-operations-final

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-v1-1-operations-final
          fetch-depth: 0
      - name: Write admin operations module
        shell: bash
        run: |
          cat > /tmp/admin-data.js.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/admin-data.js.gz.b64 | gzip -d > admin-data.js
      - name: Patch admin and home recommendation pool
        shell: python
        run: |
          from pathlib import Path
          admin=Path('admin.html')
          a=admin.read_text(encoding='utf-8')
          marker='<script src="admin-data.js"></script>'
          if marker not in a:
              if '</body>' not in a:
                  raise SystemExit('admin body marker missing')
              a=a.replace('</body>',marker+'\n</body>',1)
              admin.write_text(a,encoding='utf-8')

          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          old="function randomCandidates(){return (appState.movies||[]).filter(m=>m.personal?.status==='want'&&!(m.watchHistory||[]).length&&m.info?.title)}"
          new="function randomCandidates(){const all=(appState.movies||[]).filter(m=>m.personal?.status==='want'&&!(m.watchHistory||[]).length&&m.info?.title),ids=Array.isArray(appState.home?.featured)?appState.home.featured:[],featured=ids.map(id=>all.find(m=>m.id===id)).filter(Boolean);return featured.length?featured:all}"
          if old in s:
              s=s.replace(old,new,1)
              index.write_text(s,encoding='utf-8')
          elif new not in s:
              raise SystemExit('randomCandidates marker missing')
      - name: Validate and self-clean
        shell: bash
        run: |
          node --check admin-data.js
          grep -q 'admin-data.js' admin.html
          grep -q 'appState.home?.featured' index.html
          rm -f .github/workflows/install-admin-v1-1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- admin-data.js admin.html index.html .github/workflows/install-admin-v1-1.yml
          git commit -m 'feat: add admin v1.1 operations console'
          git push origin HEAD:feat/admin-v1-1-operations-final
