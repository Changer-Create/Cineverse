name: Cineverse checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium

      - name: Run runtime and syntax checks
        run: npm run check

      - name: Run browser regression
        run: npm run test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cineverse-browser-${{ github.event.pull_request.head.sha }}
          path: browser-artifacts/
          if-no-files-found: warn
          retention-days: 7
