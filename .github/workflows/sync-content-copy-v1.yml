name: Sync Content Copy V1

on:
  push:
    branches:
      - feat/admin-content-center-v1

permissions:
  contents: write

jobs:
  sync-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-content-center-v1
          fetch-depth: 0
      - name: Update TMDb content metadata
        shell: python
        run: |
          from pathlib import Path
          p=Path('content-center.js')
          s=p.read_text(encoding='utf-8')
          old="defaultValue:'TMDb · 影视资料补全'"
          new="defaultValue:'TMDb · 影视资料服务'"
          if old not in s and new not in s:
              raise SystemExit('TMDb content schema marker not found')
          if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate and self-clean
        shell: bash
        run: |
          node --check content-center.js
          grep -q "defaultValue:'TMDb · 影视资料服务'" content-center.js
          rm -f .github/workflows/sync-content-copy-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content-center.js .github/workflows/sync-content-copy-v1.yml
          git commit -m 'fix: align content center with TMDb proxy copy'
          git push origin HEAD:feat/admin-content-center-v1
