name: Fix library grid 8x8

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_library_grid_8x8.py'
      - '.github/workflows/fix-library-grid.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply library grid update
        run: python tools/fix_library_grid_8x8.py
      - name: Validate page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          if 'grid-template-columns:repeat(8,minmax(0,1fr))' not in s:
              raise SystemExit('8-column grid missing')
          if 'id="libPageSize"' in s or "libPageSize:$('libPageSize')" in s or 'els.libPageSize' in s:
              raise SystemExit('page-size selector residue')
          if "pageSize:64" not in s:
              raise SystemExit('fixed page size 64 missing')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          print('library grid validation passed')
          PY
          node --check /tmp/app.js
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: compact library to 8x8 grid'
          git push
