name: Install Admin V1.1 on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.head_ref == 'feat/admin-v1-1-operations-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-v1-1-operations-final
          fetch-depth: 0
      - name: Install V1.1 from staged payload
        shell: python
        run: |
          from pathlib import Path
          import re, base64, gzip
          workflow=Path('.github/workflows/install-admin-v1-1.yml').read_text(encoding='utf-8')
          m=re.search(r"cat > /tmp/admin-data\.js\.gz\.b64 <<'EOF'\n(.*?)\nEOF",workflow,re.S)
          if not m:
              raise SystemExit('staged admin payload not found')
          Path('admin-data.js').write_bytes(gzip.decompress(base64.b64decode(m.group(1).strip())))

          admin=Path('admin.html')
          a=admin.read_text(encoding='utf-8')
          marker='<script src="admin-data.js"></script>'
          if marker not in a:
              a=a.replace('</body>',marker+'\n</body>',1)
              admin.write_text(a,encoding='utf-8')

          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          old="function randomCandidates(){return (appState.movies||[]).filter(m=>m.personal?.status==='want'&&!(m.watchHistory||[]).length&&m.info?.title)}"
          new="function randomCandidates(){const all=(appState.movies||[]).filter(m=>m.personal?.status==='want'&&!(m.watchHistory||[]).length&&m.info?.title),ids=Array.isArray(appState.home?.featured)?appState.home.featured:[],featured=ids.map(id=>all.find(m=>m.id===id)).filter(Boolean);return featured.length?featured:all}"
          if old in s:
              index.write_text(s.replace(old,new,1),encoding='utf-8')
          elif new not in s:
              raise SystemExit('randomCandidates marker missing')
      - name: Validate and self-clean
        shell: bash
        run: |
          node --check admin-data.js
          grep -q 'admin-data.js' admin.html
          grep -q 'appState.home?.featured' index.html
          rm -f .github/workflows/install-admin-v1-1.yml .github/workflows/install-admin-v1-1-pr.yml .admin-v1-1-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add admin v1.1 operations console'
          git push origin HEAD:feat/admin-v1-1-operations-final
