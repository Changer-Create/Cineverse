name: Apply settings alignment

on:
  push:
    branches: [main]
    paths:
      - 'tools/align_settings_grid.py'
      - '.github/workflows/apply-settings-alignment.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply settings alignment
        run: python tools/align_settings_grid.py
      - name: Validate page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            '/* ===== Settings aligned 2x2 grid ===== */',
            'grid-template-columns:minmax(0,1fr) minmax(0,1fr)',
            'settings-stack:first-child>.settings-card:nth-child(1)',
            'settings-stack:nth-child(2)>.settings-card:nth-child(2)',
            'grid-column:1/-1',
          ]
          for token in required:
            if token not in s:
              raise SystemExit('missing settings alignment token: '+token)
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m:
            raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit page update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: align settings cards in shared two-column grid'
          git push
