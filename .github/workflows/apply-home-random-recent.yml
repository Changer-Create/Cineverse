name: Apply home random/recent rebalance

on:
  push:
    branches: [main]
    paths:
      - 'tools/rebalance_home_random_recent.py'
      - '.github/workflows/apply-home-random-recent.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply home layout rebalance
        run: python tools/rebalance_home_random_recent.py
      - name: Validate page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            '/* ===== Home random/recent rebalance ===== */',
            'grid-template-columns:minmax(300px,.72fr) minmax(560px,1.48fr)',
            'height:342px',
            'grid-template-rows:repeat(4,minmax(0,1fr))',
            'overflow-y:auto',
          ]
          for token in required:
              if token not in s:
                  raise SystemExit('missing '+token)
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit page update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: enlarge random pick and compact recent watched'
          git push
