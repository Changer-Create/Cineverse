<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>影视收藏夹 · 管理员验证</title>
<style>
:root{--line:rgba(166,182,255,.18);--text:#f7f3ff;--muted:#8f9ab8;--purple:#9f7cff;--gold:#f5c66c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 78% 10%,rgba(130,82,255,.20),transparent 27%),radial-gradient(circle at 18% 84%,rgba(64,126,255,.14),transparent 30%),linear-gradient(145deg,#030714,#08122a 55%,#091630);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.card{width:min(430px,100%);border:1px solid var(--line);border-radius:24px;padding:28px;background:linear-gradient(155deg,rgba(13,25,55,.97),rgba(8,18,42,.96));box-shadow:0 30px 90px rgba(0,0,0,.42)}
.mark{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;margin-bottom:18px;background:linear-gradient(145deg,rgba(159,124,255,.28),rgba(245,198,108,.15));border:1px solid rgba(194,173,255,.24);color:#f5cf82;font-size:22px}
h1{margin:0;font:600 26px "Songti SC","STSong",serif;color:#fff0cf}p{margin:8px 0 22px;color:var(--muted);font-size:12px;line-height:1.7}
.field{display:grid;gap:6px;margin-top:12px}.field label{font-size:10px;color:#929dbc}.field input{width:100%;border:1px solid var(--line);border-radius:12px;background:#071128;color:#f4f1fb;padding:11px 12px;outline:none}.field input:focus{border-color:rgba(159,124,255,.52);box-shadow:0 0 0 3px rgba(159,124,255,.08)}
button{width:100%;margin-top:18px;border:1px solid rgba(159,124,255,.42);border-radius:12px;background:linear-gradient(135deg,rgba(119,83,224,.78),rgba(67,98,204,.66));color:#fff;padding:11px 13px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
.status{min-height:18px;margin-top:11px;color:#ff9fb2;font-size:10px;line-height:1.55}.note{margin-top:12px;color:#657391;font-size:9px;line-height:1.6}.back{display:block;margin-top:16px;text-align:center;color:#9aa6c4;text-decoration:none;font-size:10px}
</style>
</head>
<body>
<main class="card">
  <div class="mark">◇</div>
  <h1>管理员验证</h1>
  <p>影视收藏夹管理后台仅向管理员开放。验证通过后，本次标签页内保持登录。</p>
  <form id="loginForm">
    <div class="field"><label for="username">管理员</label><input id="username" autocomplete="username" value="changer" required></div>
    <div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button id="submitBtn" type="submit">进入管理后台</button>
    <div class="status" id="status"></div>
  </form>
  <div class="note">认证由 Supabase 服务端完成；密码不会写入网页源码或 GitHub 仓库。</div>
  <a class="back" href="index.html">← 返回影视收藏夹</a>
</main>
<script src="cineverse-config.js"></script>
<script>
(() => {
  const ENDPOINT=window.CineverseConfig.endpoints.adminAuth;
  const TOKEN_KEY='movie-collection-admin-session-v1';
  const META_KEY='movie-collection-admin-session-meta-v1';
  const next=new URLSearchParams(location.search).get('next')||'';
  const ssGet=k=>{try{return sessionStorage.getItem(k)||''}catch{return ''}};
  const ssSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch{}};
  const ssDel=k=>{try{sessionStorage.removeItem(k)}catch{}};
  const status=document.querySelector('#status'),form=document.querySelector('#loginForm'),btn=document.querySelector('#submitBtn');

  async function request(action,payload={},token=''){
    const headers={'Content-Type':'application/json'};
    if(token)headers.Authorization=`Bearer ${token}`;
    const res=await fetch(ENDPOINT,{method:'POST',headers,body:JSON.stringify({action,...payload}),cache:'no-store'});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.message||'管理员认证失败');
    return data;
  }
  function go(){location.replace(next==='visual'?'index.html?contentEdit=1':'admin-console.html')}

  (async()=>{
    const token=ssGet(TOKEN_KEY);if(!token)return;
    try{const data=await request('verify',{},token);if(data?.valid){ssSet(META_KEY,JSON.stringify({username:data.username||'changer',expiresAt:data.expiresAt||''}));go();return}}catch{}
    ssDel(TOKEN_KEY);ssDel(META_KEY);
  })();

  form.addEventListener('submit',async e=>{
    e.preventDefault();status.textContent='';btn.disabled=true;btn.textContent='正在验证…';
    const username=document.querySelector('#username').value.trim(),password=document.querySelector('#password').value;
    try{
      const data=await request('login',{username,password});
      ssSet(TOKEN_KEY,data.token||'');ssSet(META_KEY,JSON.stringify({username:data.username||username,expiresAt:data.expiresAt||''}));go();
    }catch(err){
      status.textContent=err?.message||'验证失败，请重试';
      document.querySelector('#password').select();
    }finally{btn.disabled=false;btn.textContent='进入管理后台'}
  });
  setTimeout(()=>document.querySelector('#password')?.focus(),0);
})();
</script>
</body>
</html>
